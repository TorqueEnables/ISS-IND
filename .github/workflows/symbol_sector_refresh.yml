name: Refresh Symbol→Sector map
on:
  schedule:
    - cron: "00 1 * * 1"   # 06:30 IST Mondays
  workflow_dispatch:

concurrency:
  group: repo-writes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-map:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: true }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pandas
      - name: Build map
        run: python scripts/build_symbol_sector.py
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ref/symbol_sector.csv
          git diff --staged --quiet && echo "No changes" && exit 0 || true
          git commit -m "Refresh symbol→sector (auto)"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }}
